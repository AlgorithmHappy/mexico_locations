spring.application.name=mexico_locations
server.port=1609

#Configuracion de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/db_mexico_locations
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
#Propiedad para resetear la base de datos
spring.jpa.hibernate.ddl-auto=update

#Configuracion de JPA para batch
spring.batch.jdbc.initialize-schema=always
#Produccion
#spring.batch.jdbc.initialize-schema=never


#Configuración del webdriver y la navegación
webdriver.chrome.driver.path=/home/luisgmm/Documentos/Proyectos/mexico_locations/src/main/resources/chromedriver/chromedriver
webdriver.chrome.mode=--headless
webdriver.chrome.disable-gpu=--disable-gpu
webdriver.chrome.no-sandbox=--no-sandbox
webdriver.chrome.window-size=--window-size=1920,1080
webdriver.chrome.wait-timeout.element=30
webdriver.chrome.wait-timeout.download=30000
webdriver.chrome.file.ignore=.crdownload
browser.url=https://www.correosdemexico.gob.mx/sslservicios/consultacp/CodigoPostal_Exportar.aspx
browser.input.radiobutton.id=rblTipo_1
browser.input.button.id=btnDescarga
browser.download.file.name=CPdescargatxt
browser.download.file.extension=.zip
download.directory=/home/luisgmm/Documentos/Proyectos/mexico_locations/src/main/resources/download

decompress.file.path=download
decompress.file.name=CPdescarga
decompress.file.extension=.txt
decompress.file.separator=|
decompress.file.encoding=ISO-8859-15

spring.batch.job.enabled=true

# Deshabilitar las devtools ya que al descargar el archivo de texto de las locaciones de mexico lo reinicia solo porque detecta cambios
#spring.devtools.restart.enabled=false

text.raw.level.history=2
text.raw.level.history.name=itemReadAndSaveDataStepBean